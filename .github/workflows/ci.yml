name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # uv's own Python, which ships the headers the C++ module needs.
      - run: uv sync --locked --python-preference only-managed --group jax
      # The Warp env's tests, on Warp's CPU backend (the runners have no GPU).
      # PyPI's wheel runs there; the warp group's CUDA 12 build and CUDA JAX
      # are only needed on a GPU. A cold kernel cache takes about 2 minutes.
      - run: uv pip install warp-lang==1.18.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/warp
          key: warp-kernels-${{ hashFiles('src/elevator_rl/warp_env.py', 'src/elevator_rl/building*.py') }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Build and test the C++ port
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$PWD/.venv/bin/python
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure
      # With cpp/build and elevator_rl._cpp present, tests/test_cpp*.py check
      # parity with Python instead of skipping.
      - run: uv run pytest
