[project]
name = "elevator-dispatching-rl"
version = "0.1.0"
description = "Reinforcement learning for single-lift elevator dispatching with Gymnasium and Stable-Baselines3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Paul Alexander" }]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "stable-baselines3>=2.4.1",
    "torch>=2.2.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.8.0.post1"]
bench = ["psutil>=5.9"]

[dependency-groups]
dev = [
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_rl"]

[tool.uv]
required-environments = [
 "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running training tests (deselected by default; run with -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
