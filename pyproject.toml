[project]
name = "elevator-dispatching-rl"
version = "0.1.0"
description = "Reinforcement learning for single-lift elevator dispatching with Gymnasium and Stable-Baselines3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Paul Alexander" }]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "stable-baselines3>=2.4.1",
]

# torch comes from the CPU index by default (the `cpu` group). For a GPU:
#   uv sync --no-group cpu --group cuda
# CUDA 12.6 wheels are the newest that still run on Pascal GPUs (GTX 10xx);
# macOS has no CUDA, so there the cuda group falls back to the CPU wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0+cu12-py3-none-manylinux_2_28_x86_64.whl" }
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu126", group = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", group = "cuda", marker = "sys_platform == 'darwin'" },
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.8.0.post1"]
bench = ["psutil>=5.9"]

[dependency-groups]
cpu = ["torch>=2.2.2"]
cuda = ["torch>=2.2.2"]
# The JAX port (jax_env, jax_ppo). jax-cuda adds the CUDA 12 plugin. JAX no
# longer ships wheels for Intel Macs.
jax = [
    "jax>=0.6 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "optax>=0.2.4 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
]
jax-cuda = [
    { include-group = "jax" },
    "jax[cuda12]>=0.6 ; sys_platform == 'linux'",
]
# NVIDIA Warp (warp_env), run through JAX. PyPI's warp-lang is built with CUDA
# 13, which dropped Pascal (GTX 10xx) GPUs, so this takes the CUDA 12 build
# from Warp's GitHub release (Linux x86_64 only).
warp = [
    { include-group = "jax-cuda" },
    "warp-lang ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
    "nanobind>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.6",
]
hydra = [
    "hydra-core>=1.3",
    "optuna>=4",
]

# scikit-build-core builds the C++ port (cpp/) into the package: the nanobind
# module elevator_rl._cpp and the C library libelevator_c. Without a C++
# compiler, or with ELEVATOR_NO_CPP=1, it installs the pure-Python package,
# and the C++ backends report that they are not built.
[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.version = ">=3.20"
wheel.packages = ["src/elevator_rl"]
# A build directory that persists, so C++ edits rebuild incrementally.
build-dir = "cpp/build/skbuild/{wheel_tag}"
sdist.exclude = ["cpp/build", "runs"]

[[tool.scikit-build.overrides]]
if.env.ELEVATOR_NO_CPP = true
wheel.cmake = false

[[tool.scikit-build.overrides]]
if.failed = true
wheel.cmake = false
messages.after-success = "The C++ build failed, so elevator_rl was installed without its C++ backends (see the error above)."

[tool.uv]
default-groups = ["dev", "cpu"]
# Rebuild the package (and so the C++) when these change, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "cpp/CMakeLists.txt" },
    { file = "cpp/src/**" },
    { file = "cpp/include/**" },
    { file = "cpp/capi/**" },
    { file = "cpp/python/**" },
    { env = "ELEVATOR_NO_CPP" },
]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]
required-environments = [
 "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running training tests (deselected by default; run with -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Warp kernels need `int(0)`, not `0`, for a variable a loop changes.
"src/elevator_rl/warp_env.py" = ["UP018"]
