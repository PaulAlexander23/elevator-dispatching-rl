[project]
name = "elevator-dispatching-rl2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "pytest>=9.1.1",
    "stable-baselines3>=2.4.1",
    "torch>=2.2.2",
    "torch-geometric>=2.8.0.post1",
]

[tool.uv]
required-environments = [
 "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: long-running training tests (deselected by default; run with -m slow)"]
