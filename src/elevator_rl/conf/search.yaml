# The Optuna search space for elevator_rl.tune_search: config key -> range.
# {low, high, log?} samples a float (or an int when both ends are ints);
# {choices: [...]} picks one value.
ppo.learning_rate: {low: 1.0e-5, high: 1.0e-3, log: true}
ppo.n_epochs: {choices: [1, 3, 5, 10]}
ppo.batch_size: {choices: [64, 256, 512, 2048]}  # must divide n_envs x n_steps
ppo.ent_coef: {low: 1.0e-5, high: 0.05, log: true}
ppo.clip_range: {choices: [0.1, 0.2, 0.3]}
ppo.gae_lambda: {choices: [0.9, 0.95, 0.98]}
ppo.gamma: {choices: [0.98, 0.99, 0.995]}
ppo.net_arch: {choices: [[64, 64], [256, 256], [512, 512]]}
